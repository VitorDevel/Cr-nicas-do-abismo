<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crônicas do Abismo - RPG 3D</title>
<meta name="description" content="RPG de batalha 3D com personalização de personagem.">
<style>
:root{color-scheme:dark;--gold:#e9b949;--ink:#07101b;--panel:rgba(9,18,30,.88);--line:rgba(233,185,73,.4)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#08111d;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
#game-container{position:relative;width:100%;max-width:1000px;height:600px;background:#000;border:2px solid var(--gold);border-radius:8px;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,0.8)}
#canvas-container{width:100%;height:100%}
canvas{width:100%;height:100%;display:block}
.ui-panel{position:absolute;top:10px;left:10px;background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:8px;width:280px;max-height:calc(100% - 20px);overflow-y:auto;z-index:10;box-shadow:0 4px 6px rgba(0,0,0,0.3)}
h2,h3{color:var(--gold);margin-top:0;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.form-group{margin-bottom:12px}
label{display:block;font-size:12px;margin-bottom:4px;color:#a3b8cc;text-transform:uppercase}
select,input[type="color"]{width:100%;padding:8px;background:#0d1b2a;border:1px solid var(--line);color:#fff;border-radius:4px;outline:none}
select:focus{border-color:var(--gold)}
button{width:100%;padding:10px;background:var(--gold);color:var(--ink);border:none;border-radius:4px;font-weight:bold;cursor:pointer;transition:all 0.2s;margin-top:5px;text-transform:uppercase}
button:hover{background:#f5cb5c;box-shadow:0 0 10px rgba(233,185,73,0.5)}
#stats-panel{position:absolute;top:10px;right:10px;background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:8px;width:200px;z-index:10;pointer-events:none}
.stat-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.stat-value{font-weight:bold;color:var(--gold)}
.controls-hint{position:absolute;bottom:10px;right:10px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:6px;font-size:11px;color:#a3b8cc;pointer-events:none}
</style>
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="canvas-container"></div>
    
    <!-- Customization Menu UI -->
    <div class="ui-panel">
        <h2>Criador de Herói</h2>
        
        <div class="form-group">
            <label for="race-select">Raça</label>
            <select id="race-select">
                <option value="human">Humano</option>
                <option value="orc">Orce (Pele Verde / Presas)</option>
                <option value="dwarf">Anão (Pequeno / Robusto)</option>
                <option value="elf">Elfo (Orelhas Longas / Esbelto)</option>
                <option value="tiefling">Tiefling (Chifres / Pele Cinza)</option>
                <option value="minotaur">Minotauro (Cabeça de Touro)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="class-select">Classe (Armadura)</label>
            <select id="class-select">
                <option value="warrior">Guerreiro (Placas Pesadas)</option>
                <option value="mage">Mago (Túnica Mágica)</option>
                <option value="rogue">Ladino (Couro Leve)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="weapon-select">Arma Equipada</label>
            <select id="weapon-select">
                <option value="sword">Espada Longa</option>
                <option value="axe">Machado de Batalha</option>
                <option value="staff">Cajado Arcano</option>
                <option value="daggers">Adagas Duplas</option>
            </select>
        </div>

        <div class="form-group">
            <label for="skin-color">Tom de Pele Personalizado</label>
            <input type="color" id="skin-color" value="#d2b48c">
        </div>

        <button id="randomize-btn">Aleatório</button>
    </div>

    <!-- Status Panel -->
    <div id="stats-panel">
        <h3>Atributos</h3>
        <div class="stat-row"><span>Força:</span><span id="stat-str" class="stat-value">10</span></div>
        <div class="stat-row"><span>Agilidade:</span><span id="stat-agi" class="stat-value">10</span></div>
        <div class="stat-row"><span>Inteligência:</span><span id="stat-int" class="stat-value">10</span></div>
        <div class="stat-row"><span>Vitalidade:</span><span id="stat-vit" class="stat-value">10</span></div>
    </div>

    <div class="controls-hint">Arraste para girar a câmera</div>
</div>

<script>
// --- THREE.JS SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08111d);

// Camera
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 2.5, 5);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0xe9b949, 0.5, 10);
pointLight.position.set(-3, 2, -2);
scene.add(pointLight);

// Pedestal / Floor
const floorGeo = new THREE.CylinderGeometry(2, 2.2, 0.4, 32);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2636, roughness: 0.8, metalness: 0.2 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -0.2;
floor.receiveShadow = true;
scene.add(floor);

// Pedestal Ring (Glow)
const ringGeo = new THREE.TorusGeometry(2.05, 0.03, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xe9b949 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

// --- CHARACTER GENERATOR ---
let characterGroup = new THREE.Group();
scene.add(characterGroup);

// Node References for Dynamic Parts
let headMesh, torsoMesh, leftArmMesh, rightArmMesh, leftLegMesh, rightLegMesh;
let headFeaturesGroup = new THREE.Group();
let weaponRightGroup = new THREE.Group();
let weaponLeftGroup = new THREE.Group();

// Materials
const defaultSkinMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
const armorMat = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.7 });
const clothMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.1 });
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.7 });
const weaponMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8, roughness: 0.2 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
const hornMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });

// Race Data Configurations
const raceConfigs = {
    human: { height: 1.0, width: 1.0, color: '#d2b48c', str: 10, agi: 10, int: 10, vit: 10 },
    orc: { height: 1.15, width: 1.3, color: '#4d7c38', str: 15, agi: 8, int: 6, vit: 13 },
    dwarf: { height: 0.7, width: 1.25, color: '#e0ac69', str: 13, agi: 6, int: 8, vit: 15 },
    elf: { height: 1.05, width: 0.85, color: '#ffdbac', str: 7, agi: 14, int: 13, vit: 8 },
    tiefling: { height: 1.0, width: 0.95, color: '#686d76', str: 9, agi: 11, int: 14, vit: 8 },
    minotaur: { height: 1.3, width: 1.4, color: '#543d2b', str: 16, agi: 7, int: 5, vit: 14 }
};

// Class Color Configurations
const classConfigs = {
    warrior: { color: 0x7a8a9e, material: armorMat, strAdd: 3, vitAdd: 2 },
    mage: { color: 0x5c2c6d, material: clothMat, intAdd: 5 },
    rogue: { color: 0x3d2b1f, material: leatherMat, agiAdd: 4, strAdd: 1 }
};

function buildBaseBody() {
    // Clear previous
    while(characterGroup.children.length > 0){ 
        characterGroup.remove(characterGroup.children[0]); 
    }
    
    headFeaturesGroup = new THREE.Group();
    weaponRightGroup = new THREE.Group();
    weaponLeftGroup = new THREE.Group();

    // Torso
    const torsoGeo = new THREE.BoxGeometry(0.5, 0.7, 0.3);
    torsoMesh = new THREE.Mesh(torsoGeo, armorMat);
    torsoMesh.position.y = 1.05;
    torsoMesh.castShadow = true;
    characterGroup.add(torsoMesh);

    // Head
    const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
    headMesh = new THREE.Mesh(headGeo, defaultSkinMat);
    headMesh.position.set(0, 0.525, 0);
    headMesh.castShadow = true;
    torsoMesh.add(headMesh);
    headMesh.add(headFeaturesGroup);

    // Arms
    const armGeo = new THREE.BoxGeometry(0.15, 0.6, 0.15);
    
    leftArmMesh = new THREE.Mesh(armGeo, armorMat);
    leftArmMesh.position.set(-0.35, 0.0, 0);
    leftArmMesh.castShadow = true;
    torsoMesh.add(leftArmMesh);

    rightArmMesh = new THREE.Mesh(armGeo, armorMat);
    rightArmMesh.position.set(0.35, 0.0, 0);
    rightArmMesh.castShadow = true;
    torsoMesh.add(rightArmMesh);

    // Attach weapon mounts to hands
    weaponRightGroup.position.set(0, -0.25, 0.1);
    rightArmMesh.add(weaponRightGroup);
    
    weaponLeftGroup.position.set(0, -0.25, 0.1);
    leftArmMesh.add(weaponLeftGroup);

    // Legs
    const legGeo = new THREE.BoxGeometry(0.18, 0.7, 0.18);
    
    leftLegMesh = new THREE.Mesh(legGeo, defaultSkinMat);
    leftLegMesh.position.set(-0.15, -0.7, 0);
    leftLegMesh.castShadow = true;
    torsoMesh.add(leftLegMesh);

    rightLegMesh = new THREE.Mesh(legGeo, defaultSkinMat);
    rightLegMesh.position.set(0.15, -0.7, 0);
    rightLegMesh.castShadow = true;
    torsoMesh.add(rightLegMesh);
}

function updateCharacter() {
    const raceKey = document.getElementById('race-select').value;
    const classKey = document.getElementById('class-select').value;
    const weaponKey = document.getElementById('weapon-select').value;
    const skinColorHex = document.getElementById('skin-color').value;

    const race = raceConfigs[raceKey];
    const cls = classConfigs[classKey];

    // 1. Update Scales (Race Features)
    characterGroup.scale.set(race.width, race.height, race.width);

    // 2. Update Skin Color
    defaultSkinMat.color.set(skinColorHex);

    // 3. Update Class Appearance (Armor/Clothing)
    cls.material.color.setHex(cls.color);
    torsoMesh.material = cls.material;
    leftArmMesh.material = cls.material;
    rightArmMesh.material = cls.material;

    // Leg armor matching class
    leftLegMesh.material = cls.material;
    rightLegMesh.material = cls.material;

    // 4. Update Race Specific Facial Features
    updateRaceFeatures(raceKey);

    // 5. Update Weapons
    updateWeapons(weaponKey);

    // 6. Update Stats Display
    document.getElementById('stat-str').innerText = race.str + (cls.strAdd || 0);
    document.getElementById('stat-agi').innerText = race.agi + (cls.agiAdd || 0);
    document.getElementById('stat-int').innerText = race.int + (cls.intAdd || 0);
    document.getElementById('stat-vit').innerText = race.vit + (cls.vitAdd || 0);
}

function updateRaceFeatures(race) {
    // Clear head features
    while(headFeaturesGroup.children.length > 0){
        headFeaturesGroup.remove(headFeaturesGroup.children[0]);
    }

    if (race === 'orc') {
        // Tusks
        const tuskGeo = new THREE.ConeGeometry(0.03, 0.12, 8);
        tuskGeo.rotateX(-Math.PI / 4);
        
        const leftTusk = new THREE.Mesh(tuskGeo, hornMat);
        leftTusk.position.set(-0.08, -0.1, 0.18);
        headFeaturesGroup.add(leftTusk);

        const rightTusk = new THREE.Mesh(tuskGeo, hornMat);
        rightTusk.position.set(0.08, -0.1, 0.18);
        headFeaturesGroup.add(rightTusk);
    } 
    else if (race === 'elf') {
        // Pointy ears
        const earGeo = new THREE.ConeGeometry(0.05, 0.25, 4);
        earGeo.rotateZ(Math.PI / 3);
        
        const leftEar = new THREE.Mesh(earGeo, defaultSkinMat);
        leftEar.position.set(-0.22, 0.05, -0.02);
        headFeaturesGroup.add(leftEar);

        const rightEar = new THREE.Mesh(earGeo, defaultSkinMat);
        rightEar.rotation.y = Math.PI;
        rightEar.position.set(0.22, 0.05, -0.02);
        headFeaturesGroup.add(rightEar);
    } 
    else if (race === 'tiefling') {
        // Demon Horns
        const hornGeo = new THREE.ConeGeometry(0.05, 0.3, 8);
        hornGeo.rotateX(Math.PI / 6);
        
        const leftHorn = new THREE.Mesh(hornGeo, hornMat);
        leftHorn.position.set(-0.1, 0.2, 0.05);
        headFeaturesGroup.add(leftHorn);

        const rightHorn = new THREE.Mesh(hornGeo, hornMat);
        rightHorn.position.set(0.1, 0.2, 0.05);
        headFeaturesGroup.add(rightHorn);
    } 
    else if (race === 'minotaur') {
        // Bull Snout
        const snoutGeo = new THREE.BoxGeometry(0.2, 0.15, 0.15);
        const snout = new THREE.Mesh(snoutGeo, hornMat);
        snout.position.set(0, -0.05, 0.2);
        headFeaturesGroup.add(snout);

        // Large Curved Horns
        const hornGeo = new THREE.ConeGeometry(0.06, 0.4, 8);
        
        const leftHorn = new THREE.Mesh(hornGeo, hornMat);
        leftHorn.rotation.z = Math.PI / 3;
        leftHorn.position.set(-0.22, 0.15, 0);
        headFeaturesGroup.add(leftHorn);

        const rightHorn = new THREE.Mesh(hornGeo, hornMat);
        rightHorn.rotation.z = -Math.PI / 3;
        rightHorn.position.set(0.22, 0.15, 0);
        headFeaturesGroup.add(rightHorn);
    }
    else if (race === 'dwarf') {
        // Large Beard
        const beardGeo = new THREE.BoxGeometry(0.36, 0.25, 0.15);
        const beardMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.9 });
        const beard = new THREE.Mesh(beardGeo, beardMat);
        beard.position.set(0, -0.15, 0.12);
        headFeaturesGroup.add(beard);
    }
}

function updateWeapons(weapon) {
    while(weaponRightGroup.children.length > 0) weaponRightGroup.remove(weaponRightGroup.children[0]);
    while(weaponLeftGroup.children.length > 0) weaponLeftGroup.remove(weaponLeftGroup.children[0]);

    if (weapon === 'sword') {
        // Longsword in right hand
        const bladeGeo = new THREE.BoxGeometry(0.05, 0.8, 0.02);
        const hiltGeo = new THREE.BoxGeometry(0.2, 0.03, 0.05);
        
        const sword = new THREE.Group();
        const blade = new THREE.Mesh(bladeGeo, weaponMat);
        blade.position.y = 0.4;
        const hilt = new THREE.Mesh(hiltGeo, hornMat);
        sword.add(blade);
        sword.add(hilt);

        sword.rotation.x = Math.PI / 2;
        weaponRightGroup.add(sword);
    } 
    else if (weapon === 'axe') {
        // Battleaxe
        const handleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.9);
        const bladeGeo = new THREE.BoxGeometry(0.25, 0.3, 0.02);
        
        const axe = new THREE.Group();
        const handle = new THREE.Mesh(handleGeo, woodMat);
        handle.position.y = 0.2;
        const blade = new THREE.Mesh(bladeGeo, weaponMat);
        blade.position.set(0.1, 0.5, 0);

        axe.add(handle);
        axe.add(blade);
        axe.rotation.x = Math.PI / 2;
        weaponRightGroup.add(axe);
    } 
    else if (weapon === 'staff') {
        // Arcane Staff
        const staffGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.4);
        const orbGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const orbMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        
        const staff = new THREE.Group();
        const body = new THREE.Mesh(staffGeo, woodMat);
        body.position.y = 0.3;
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.position.y = 1.0;

        staff.add(body);
        staff.add(orb);
        staff.rotation.x = Math.PI / 3;
        weaponRightGroup.add(staff);
    } 
    else if (weapon === 'daggers') {
        // Dual Daggers
        const createDagger = () => {
            const dagger = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.4, 0.01), weaponMat);
            blade.position.y = 0.2;
            dagger.add(blade);
            dagger.rotation.x = Math.PI / 2;
            return dagger;
        };

        weaponRightGroup.add(createDagger());
        weaponLeftGroup.add(createDagger());
    }
}

// Initial Build
buildBaseBody();
updateCharacter();

// --- INTERACTION & EVENT LISTENERS ---

// UI Event Listeners
document.getElementById('race-select').addEventListener('change', (e) => {
    // Auto preset skin colors based on race
    const raceColors = {
        human: '#d2b48c',
        orc: '#4d7c38',
        dwarf: '#e0ac69',
        elf: '#ffdbac',
        tiefling: '#686d76',
        minotaur: '#543d2b'
    };
    document.getElementById('skin-color').value = raceColors[e.target.value];
    updateCharacter();
});

document.getElementById('class-select').addEventListener('change', updateCharacter);
document.getElementById('weapon-select').addEventListener('change', updateCharacter);
document.getElementById('skin-color').addEventListener('input', updateCharacter);

document.getElementById('randomize-btn').addEventListener('click', () => {
    const races = Object.keys(raceConfigs);
    const classes = Object.keys(classConfigs);
    const weapons = ['sword', 'axe', 'staff', 'daggers'];

    document.getElementById('race-select').value = races[Math.floor(Math.random() * races.length)];
    document.getElementById('class-select').value = classes[Math.floor(Math.random() * classes.length)];
    document.getElementById('weapon-select').value = weapons[Math.floor(Math.random() * weapons.length)];
    
    // Trigger race change to update color
    document.getElementById('race-select').dispatchEvent(new Event('change'));
});

// Orbit Rotation with Mouse Drag
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

const gameContainer = document.getElementById('game-container');

gameContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
});

gameContainer.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaMove = {
            x: e.clientX - previousMousePosition.x
        };

        characterGroup.rotation.y += deltaMove.x * 0.01;
    }
    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { isDragging = false; });

// Responsive Resize
window.addEventListener('resize', () => {
    const width = container.clientWidth;
    const height = container.clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
});

// --- ANIMATION LOOP ---
function animate() {
    requestAnimationFrame(animate);

    // Subtle idle animation
    const time = Date.now() * 0.003;
    if (torsoMesh) {
        torsoMesh.position.y = 1.05 + Math.sin(time) * 0.02;
    }

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
